[workspace]
resolver = "3"
members = ["crates/core", "crates/player", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
crunchyroll-rs = { version = "0.19.1", features = ["release-calendar"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.11"
base64 = "0.23"
chrono = "0.4"
directories = "6"
keyring = "4"
futures-util = "0.3"
slint = "1.18.1"
slint-build = "1.18.1"
wry = "0.57.1"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
